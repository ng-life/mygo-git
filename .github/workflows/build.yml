name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests and UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l *.go)"
      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: '0'
      - name: Check MyGo UI lifetimes
        run: go tool mygo vet .
      - name: Race test
        run: go test -race ./...
        env:
          CGO_ENABLED: '1'

  build:
    name: Build ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin/arm64
            artifact: macos-arm64
          - runner: macos-15-intel
            target: darwin/amd64
            artifact: macos-amd64
          - runner: windows-latest
            target: windows/amd64
            artifact: windows-amd64
          - runner: ubuntu-latest
            target: linux/amd64
            artifact: linux-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build native package
        run: go tool mygo build -platform ${{ matrix.target }} -skip-build-command -skip-dmg -skip-installer
        env:
          CGO_ENABLED: '0'
      - name: Archive and checksum
        run: python scripts/package.py dist ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mygo-git-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: dist/artifacts/*

  release:
    name: Publish tag release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mygo-git-*
          path: artifacts
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --generate-notes
